<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - RideFlow</title>
   
</head>
<body>
    <header>
        <h1>Log In to RideFlow</h1>

        <nav aria-label="Main navigation">
            <a href="landing.html">Home</a> |
            <a href="login.html">Log In</a> |
        </nav>
    </header>

    <main>
        <section>
            <h2>Sign In</h2>

            <form action="../api/auth/login.php" method="post" novalidate>
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required
                           autocomplete="email" placeholder="you@example.com">
                </p>

                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" required
                           autocomplete="current-password">
                </p>

                <p>
                    <button type="submit">Log In</button>
                    <button type="reset">Clear</button>
                </p>
            </form>

            <p id="login-message" role="alert"></p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 RideFlow Transportation Network. All rights reserved.</p>
    </footer>
</body>
</html>
